services:
  web:
    build: .
    pull_policy: build
    container_name: jstowav
    restart: unless-stopped
    ports:
      - "127.0.0.1:31004:3000"
    read_only: true
    volumes:
      - jstowav_jobs:/data/jobs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  jstowav_jobs:
